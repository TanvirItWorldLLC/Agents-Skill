name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'
          ndk-version: 'r26c'
          cmake-version: '3.22.1'

      - name: Download Face Landmarker model
        run: |
          chmod +x ./download_model.sh
          ./download_model.sh

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FaceMesh AR ${{ steps.version.outputs.tag }}
          body: |
            ## FaceMesh AR ${{ steps.version.outputs.tag }}

            Real-time 468-point face landmark tracking with MediaPipe + CameraX + GPU delegate.

            ### Features
            - 468 facial landmarks (eyes, eyebrows, nose, mouth, face oval)
            - GPU-accelerated inference via MediaPipe GPU delegate
            - CameraX for robust camera handling
            - LIVE_STREAM mode — async processing, no frame drops
            - ~30 FPS on mid-range devices
            - < 15 MB APK

            ### Installation
            Download `app-release.apk` below and install on Android 7.0+ device.

            ### Changes
            See [commits](https://github.com/tnvmac-web/FacemashAr/compare/${{ github.event.repository.default_branch }}...${{ steps.version.outputs.tag }})
          files: |
            app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false